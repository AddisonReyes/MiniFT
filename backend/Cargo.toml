[package]
name = "minift-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = "9.3.0"
percent-encoding = "2.3.1"
quoted_printable = "0.5.1"
regex = "1.11.1"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
resend-rs = { version = "0.25.0", default-features = false, features = ["rustls-tls"] }
rocket = { version = "0.5.1", features = ["json", "uuid"] }
rust_decimal = { version = "1.36.0", features = ["serde"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
sha2 = "0.10.8"
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "migrate"] }
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "time"] }
utoipa = { version = "5.4.0", features = ["chrono", "decimal", "rocket_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["rocket", "vendored"] }
uuid = { version = "1.11.0", features = ["serde", "v4"] }
